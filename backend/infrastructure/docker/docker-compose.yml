version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mcr_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_mcr}
      MYSQL_DATABASE: mcr_pro
      MYSQL_USER: mcr_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mcr_db_pass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  server:
    build:
      context: ../../..
      dockerfile: backend/infrastructure/docker/Dockerfile.server
    container_name: mcr_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      MCR_BIND_HOST: 0.0.0.0
      MCR_ADMIN_PASSWORD: ${MCR_ADMIN_PASSWORD:-}
      STORAGE_MODE: mysql
      DATABASE_URL: mysql://mcr_user:${MYSQL_PASSWORD:-change_me_mcr_db_pass}@mysql:3306/mcr_pro
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in the deployment environment}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in the deployment environment}
      CORS_ORIGIN: http://localhost:80
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ../../..
      dockerfile: backend/infrastructure/docker/Dockerfile.web
    container_name: mcr_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql_data:
