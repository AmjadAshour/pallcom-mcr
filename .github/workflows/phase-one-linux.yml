name: Phase One isolated Linux verification

on:
  push:
    branches: [codex/phase-one-linux-verification]

permissions: {}

jobs:
  linux-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the public review commit
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify Linux Compose and isolated media
        run: bash backend/verification/linux-compose-loopback.sh

  real-obs-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the public review commit
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Build and verify disposable OBS Studio
        run: |
          docker build --target iptv --build-arg NODE_IMAGE=node:22-bookworm-slim -t mcr-phase-one-worker -f backend/infrastructure/docker/Dockerfile.server .
          docker build -t mcr-phase-one-obs-fixture -f backend/verification/Dockerfile.obs-verification .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
            -e MCR_TEST_REAL_OBS=1 mcr-phase-one-obs-fixture \
            timeout -k 5s 120s xvfb-run -a node backend/verification/phase-one-local-staging.js

  offline-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the public review commit
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download public advisories and scan without network access
        run: bash backend/verification/offline-npm-advisories.sh

  desktop-runtime:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the public review commit
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Windows workspace dependencies
        shell: bash
        run: npm ci --no-audit --no-fund
      - name: Build the Windows frontend
        shell: bash
        run: npm run build:web
      - name: Run Windows workspace tests
        shell: bash
        run: npm test
      - name: Install the pinned Electron runtime
        shell: bash
        run: npm exec --workspace @mcr/desktop -- install-electron
      - name: Verify Electron renderer isolation and IPC
        shell: bash
        run: node backend/verification/desktop-loopback.js
